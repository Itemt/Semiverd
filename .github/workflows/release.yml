name: Build and Release

on:
  push:
    tags:
      - 'v*' # Trigger on tags starting with v (e.g., v1.0.0)

jobs:
  build:
    name: Build for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact_name: Semiverd-Windows-x64.zip
            asset_name: Semiverd-Windows-x64.zip
          - os: macos-13
            artifact_name: Semiverd-macOS-x64.dmg
            asset_name: Semiverd-macOS-x64.dmg
          - os: macos-14
            artifact_name: Semiverd-macOS-arm64.dmg
            asset_name: Semiverd-macOS-arm64.dmg
    
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install macOS specific packages
        if: runner.os == 'macOS'
        run: |
          brew install cmake
          npm install -g create-dmg

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build with PyInstaller (Windows)
        if: runner.os == 'Windows'
        run: |
          pyinstaller --onedir --name Semiverd main.py
          Copy-Item -Path "views" -Destination "dist\Semiverd\views" -Recurse
          Copy-Item -Path "faces_db" -Destination "dist\Semiverd\faces_db" -Recurse
          Copy-Item -Path ".env.example" -Destination "dist\Semiverd\.env"
          Compress-Archive -Path "dist\Semiverd\*" -DestinationPath "${{ matrix.artifact_name }}"

      - name: Build with PyInstaller (macOS)
        if: runner.os == 'macOS'
        run: |
          pyinstaller --onedir --windowed --name Semiverd main.py
          cp -r views dist/Semiverd.app/Contents/MacOS/
          cp -r faces_db dist/Semiverd.app/Contents/MacOS/
          cp .env.example dist/Semiverd.app/Contents/MacOS/.env
          
          # Copiar también al lado por si acaso
          cp -r views dist/
          cp -r faces_db dist/
          cp .env.example dist/.env
          
          # Create dmg
          create-dmg dist/Semiverd.app || true
          mv *.dmg "${{ matrix.artifact_name }}" || echo "DMG creation failed, zipping instead"
          if [ ! -f "${{ matrix.artifact_name }}" ]; then
            cd dist && zip -r "../${{ matrix.artifact_name }}" Semiverd.app views faces_db .env
          fi

      - name: Release
        uses: softprops/action-gh-release@v1
        with:
          files: ${{ matrix.artifact_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
