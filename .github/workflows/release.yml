name: Build and Release

permissions:
  contents: write

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact_name: Semiverd-Windows-x64.zip
          - os: macos-13
            artifact_name: Semiverd-macOS-x64.zip
          - os: macos-14
            artifact_name: Semiverd-macOS-arm64.zip
    
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install cmake

      - name: Install System dependencies (Windows)
        if: runner.os == 'Windows'
        run: choco install cmake -y

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install cmake wheel setuptools
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build with PyInstaller (Windows)
        if: runner.os == 'Windows'
        run: |
          pyinstaller --onedir --name Semiverd --icon=icon.ico --hidden-import=uvicorn.logging --hidden-import=uvicorn.loops --hidden-import=uvicorn.loops.auto --hidden-import=uvicorn.protocols --hidden-import=uvicorn.protocols.http --hidden-import=uvicorn.protocols.http.auto --hidden-import=uvicorn.protocols.websockets --hidden-import=uvicorn.protocols.websockets.auto --hidden-import=uvicorn.lifespan.on --hidden-import=uvicorn.lifespan.off --hidden-import=models.models --hidden-import=models.schemas --hidden-import=psycopg2 main.py
          Copy-Item -Path "views" -Destination "dist\Semiverd\views" -Recurse
          Copy-Item -Path "faces_db" -Destination "dist\Semiverd\faces_db" -Recurse
          Copy-Item -Path ".env.example" -Destination "dist\Semiverd\.env"
          Compress-Archive -Path "dist\Semiverd\*" -DestinationPath "${{ matrix.artifact_name }}"

      - name: Build with PyInstaller (macOS)
        if: runner.os == 'macOS'
        run: |
          pyinstaller --onedir --windowed --name Semiverd --icon=icon.ico --hidden-import=uvicorn.logging --hidden-import=uvicorn.loops --hidden-import=uvicorn.loops.auto --hidden-import=uvicorn.protocols --hidden-import=uvicorn.protocols.http --hidden-import=uvicorn.protocols.http.auto --hidden-import=uvicorn.protocols.websockets --hidden-import=uvicorn.protocols.websockets.auto --hidden-import=uvicorn.lifespan.on --hidden-import=uvicorn.lifespan.off --hidden-import=models.models --hidden-import=models.schemas --hidden-import=psycopg2 --hidden-import=face_recognition main.py
          
          # Copiar vistas y db al contenido de la app de Mac (por si arranca empaquetada)
          cp -r views dist/Semiverd.app/Contents/MacOS/
          cp -r faces_db dist/Semiverd.app/Contents/MacOS/ || true
          cp .env.example dist/Semiverd.app/Contents/MacOS/.env || true
          
          # Copiar al directorio base (por si arranca normal)
          cp -r views dist/
          cp -r faces_db dist/ || true
          cp .env.example dist/.env || true
          
          cd dist && zip -r "../${{ matrix.artifact_name }}" Semiverd.app views faces_db .env

      - name: Release
        uses: softprops/action-gh-release@v1
        with:
          files: ${{ matrix.artifact_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
