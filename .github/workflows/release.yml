name: Build and Release

permissions:
  contents: write

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact_name: Semiverd.exe
          - os: macos-13
            artifact_name: Semiverd-macOS-x64.dmg
          - os: macos-14
            artifact_name: Semiverd-macOS-arm64.dmg
    
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # ── macOS ───────────────────────────────────────────────────────────────
      - name: Install System dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install cmake

      # ── Windows ─────────────────────────────────────────────────────────────
      - name: Install Visual Studio Build Tools (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          # Chocolatey ya viene instalado en GitHub Actions windows-latest
          choco install cmake --installargs 'ADD_CMAKE_TO_PATH=System' -y --no-progress
          choco install visualstudio2022buildtools --package-parameters "--add Microsoft.VisualStudio.Workload.VCTools --includeRecommended --quiet" -y --no-progress
          # Refrescar variables de entorno para que cmake y cl.exe sean visibles
          $env:PATH = [System.Environment]::GetEnvironmentVariable("PATH","Machine") + ";" + [System.Environment]::GetEnvironmentVariable("PATH","User")

      - name: Install Python dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          python -m pip install --upgrade pip
          pip install cmake wheel setuptools
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Install Python dependencies (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          python -m pip install --upgrade pip
          pip install cmake wheel setuptools
          pip install -r requirements.txt --no-deps
          pip install fastapi==0.111.0 uvicorn[standard]==0.29.0 sqlalchemy==2.0.30 python-dotenv==1.0.1 pydantic==2.7.1 python-multipart==0.0.9 Pillow==10.3.0 passlib[bcrypt]==1.7.4 bcrypt==4.1.3 python-jose[cryptography]==3.3.0 alembic==1.13.1 face-recognition==1.3.0 numpy pywebview>=5.0.6
          pip install pyinstaller

      # ── Instalar pywebview con sus backends específicos por plataforma ──────
      - name: Install pywebview (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          pip install pywebview>=5.0.6
          pip install pythonnet pywin32

      - name: Install pywebview (macOS)
        if: runner.os == 'macOS'
        run: |
          pip install pywebview>=5.0.6
          pip install pyobjc-framework-WebKit pyobjc-framework-Cocoa

      # ── Build ────────────────────────────────────────────────────────────────
      - name: Build with PyInstaller (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          python -m PyInstaller Semiverd.spec
          move dist\Semiverd.exe .\Semiverd.exe

      - name: Build with PyInstaller (macOS)
        if: runner.os == 'macOS'
        run: |
          python -m PyInstaller Semiverd.spec
          mkdir -p dist/dmg_src
          cp -r dist/Semiverd.app dist/dmg_src/
          hdiutil create -fs HFS+ -srcfolder dist/dmg_src -volname "Semiverd" -format UDZO "${{ matrix.artifact_name }}"

      # ── Publicar ─────────────────────────────────────────────────────────────
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_name }}

      - name: Release
        uses: softprops/action-gh-release@v1
        with:
          files: ${{ matrix.artifact_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
