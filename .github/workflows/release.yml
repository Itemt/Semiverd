name: Build and Release

permissions:
  contents: write

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact_name: Semiverd-Windows-x64.zip
          - os: macos-13
            artifact_name: Semiverd-macOS-x64.dmg
          - os: macos-14
            artifact_name: Semiverd-macOS-arm64.dmg
    
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install cmake

      - name: Install System dependencies (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install cmake -y

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install cmake wheel setuptools
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build with PyInstaller (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          python -m PyInstaller Semiverd.spec
          mkdir dist\Release
          move dist\Semiverd.exe dist\Release\
          copy .env.example dist\Release\.env
          cd dist\Release
          tar -a -c -f ..\..\${{ matrix.artifact_name }} *

      - name: Build with PyInstaller (macOS)
        if: runner.os == 'macOS'
        run: |
          python -m PyInstaller Semiverd.spec
          mkdir -p dist/dmg_src
          cp -r dist/Semiverd.app dist/dmg_src/
          hdiutil create -fs HFS+ -srcfolder dist/dmg_src -volname "Semiverd" -format UDZO "${{ matrix.artifact_name }}"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_name }}

      - name: Release
        uses: softprops/action-gh-release@v1
        with:
          files: ${{ matrix.artifact_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
