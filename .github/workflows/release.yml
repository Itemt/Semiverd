name: Build and Release

permissions:
  contents: write

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact_name: Semiverd-Windows-x64.zip
          - os: macos-13
            artifact_name: Semiverd-macOS-x64.zip
          - os: macos-14
            artifact_name: Semiverd-macOS-arm64.zip
    
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install cmake

      - name: Install System dependencies (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install cmake -y

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install cmake wheel setuptools
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build with PyInstaller (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          pyinstaller --onefile --name Semiverd --icon=icon.ico --hidden-import=uvicorn.logging --hidden-import=uvicorn.loops --hidden-import=uvicorn.loops.auto --hidden-import=uvicorn.protocols --hidden-import=uvicorn.protocols.http --hidden-import=uvicorn.protocols.http.auto --hidden-import=uvicorn.protocols.websockets --hidden-import=uvicorn.protocols.websockets.auto --hidden-import=uvicorn.lifespan.on --hidden-import=uvicorn.lifespan.off --hidden-import=models.models --hidden-import=models.schemas --hidden-import=psycopg2 main.py
          mkdir dist\Release
          move dist\Semiverd.exe dist\Release\
          xcopy views dist\Release\views /E /I /H /Y
          xcopy faces_db dist\Release\faces_db /E /I /H /Y
          copy .env.example dist\Release\.env
          cd dist\Release
          tar -a -c -f ..\..\${{ matrix.artifact_name }} *

      - name: Build with PyInstaller (macOS)
        if: runner.os == 'macOS'
        run: |
          pyinstaller --onedir --windowed --name Semiverd --icon=icon.ico --hidden-import=uvicorn.logging --hidden-import=uvicorn.loops --hidden-import=uvicorn.loops.auto --hidden-import=uvicorn.protocols --hidden-import=uvicorn.protocols.http --hidden-import=uvicorn.protocols.http.auto --hidden-import=uvicorn.protocols.websockets --hidden-import=uvicorn.protocols.websockets.auto --hidden-import=uvicorn.lifespan.on --hidden-import=uvicorn.lifespan.off --hidden-import=models.models --hidden-import=models.schemas --hidden-import=psycopg2 --hidden-import=face_recognition main.py
          
          mkdir -p dist/Release
          cp -r dist/Semiverd.app dist/Release/
          cp -r views dist/Release/
          cp -r faces_db dist/Release/ || true
          cp .env.example dist/Release/.env || true
          
          cd dist/Release && zip -r "../../${{ matrix.artifact_name }}" *

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_name }}

      - name: Release
        uses: softprops/action-gh-release@v1
        with:
          files: ${{ matrix.artifact_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
